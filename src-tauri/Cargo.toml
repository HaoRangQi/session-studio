[package]
name = "session-studio"
build = "build.rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "session_studio_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "session-studio"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zstd = "0.13"
trash = "5"
tauri = { version = "2", optional = true, features = ["config-toml"] }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2" }

[dev-dependencies]
tempfile = "3"
